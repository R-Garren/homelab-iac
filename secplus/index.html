<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1e293b">
<title>Sec+ SY0-701 Acronym Flashcards</title>
<style>
  /* ── Reset & base ── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f172a;
    --surface: #1e293b;
    --surface2: #334155;
    --border: #475569;
    --accent: #38bdf8;
    --accent2: #818cf8;
    --green: #34d399;
    --yellow: #fbbf24;
    --red: #f87171;
    --text: #f1f5f9;
    --muted: #94a3b8;
    --radius: 12px;
    --shadow: 0 4px 24px rgba(0,0,0,.5);
  }
  html { font-size: 16px; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, sans-serif;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
  }

  /* ── Header ── */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: .75rem 1rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: .5rem;
    flex-wrap: wrap;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  header h1 {
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--accent);
    white-space: nowrap;
  }
  header h1 span { color: var(--text); font-weight: 400; }

  /* ── Nav tabs ── */
  .tabs {
    display: flex;
    gap: .25rem;
    background: var(--bg);
    border-radius: 8px;
    padding: 3px;
  }
  .tab-btn {
    background: none;
    border: none;
    color: var(--muted);
    padding: .4rem .85rem;
    border-radius: 6px;
    cursor: pointer;
    font-size: .85rem;
    font-weight: 600;
    transition: background .15s, color .15s;
  }
  .tab-btn.active { background: var(--accent); color: #0f172a; }
  .tab-btn:hover:not(.active) { background: var(--surface2); color: var(--text); }

  /* ── Search bar ── */
  .search-wrap {
    position: relative;
    flex: 1;
    min-width: 160px;
    max-width: 320px;
  }
  .search-wrap svg {
    position: absolute;
    left: .6rem;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    pointer-events: none;
  }
  #search-input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    padding: .45rem .75rem .45rem 2rem;
    font-size: .85rem;
    outline: none;
    transition: border-color .15s;
  }
  #search-input:focus { border-color: var(--accent); }
  #search-input::placeholder { color: var(--muted); }

  /* ── Main layout ── */
  main { flex: 1; padding: 1.25rem 1rem; max-width: 900px; width: 100%; margin: 0 auto; }

  /* ── Views ── */
  .view { display: none; }
  .view.active { display: block; }

  /* ══════════════ BROWSE VIEW ══════════════ */
  .filter-bar {
    display: flex;
    gap: .5rem;
    margin-bottom: 1rem;
    flex-wrap: wrap;
    align-items: center;
  }
  .filter-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    color: var(--muted);
    padding: .3rem .85rem;
    font-size: .8rem;
    cursor: pointer;
    transition: all .15s;
  }
  .filter-btn.active { background: var(--accent2); border-color: var(--accent2); color: #fff; }
  .filter-btn:hover:not(.active) { border-color: var(--text); color: var(--text); }
  .count-badge {
    margin-left: auto;
    font-size: .8rem;
    color: var(--muted);
    white-space: nowrap;
  }

  .acronym-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: .75rem;
  }
  .acronym-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: .9rem 1rem;
    display: flex;
    flex-direction: column;
    gap: .3rem;
    cursor: default;
    transition: border-color .15s;
  }
  .acronym-card:hover { border-color: var(--accent); }
  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: .5rem;
  }
  .acronym-label {
    font-weight: 800;
    font-size: 1rem;
    color: var(--accent);
  }
  .card-actions { display: flex; gap: .3rem; }
  .status-btn {
    background: none;
    border: none;
    cursor: pointer;
    font-size: 1rem;
    line-height: 1;
    padding: 2px 4px;
    border-radius: 4px;
    transition: background .1s;
  }
  .status-btn:hover { background: var(--surface2); }
  .full-term { font-size: .9rem; color: var(--text); font-weight: 600; }
  .definition { font-size: .8rem; color: var(--muted); line-height: 1.45; }
  .status-tag {
    display: inline-block;
    font-size: .7rem;
    padding: 1px 6px;
    border-radius: 10px;
    font-weight: 600;
    margin-top: .2rem;
    width: fit-content;
  }
  .status-tag.known { background: rgba(52,211,153,.15); color: var(--green); }
  .status-tag.learning { background: rgba(251,191,36,.15); color: var(--yellow); }

  .no-results {
    text-align: center;
    color: var(--muted);
    padding: 3rem 1rem;
    font-size: .95rem;
  }

  /* ══════════════ FLASHCARD VIEW ══════════════ */
  .fc-controls {
    display: flex;
    gap: .5rem;
    margin-bottom: 1.25rem;
    flex-wrap: wrap;
    align-items: center;
  }
  .btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    padding: .45rem 1rem;
    font-size: .85rem;
    font-weight: 600;
    cursor: pointer;
    transition: all .15s;
  }
  .btn:hover { background: var(--surface2); border-color: var(--text); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #0f172a; }
  .btn.primary:hover { filter: brightness(1.1); }
  .btn.danger { background: var(--red); border-color: var(--red); color: #0f172a; }

  .fc-progress {
    margin-left: auto;
    font-size: .8rem;
    color: var(--muted);
    white-space: nowrap;
  }

  .fc-scene {
    perspective: 1000px;
    width: 100%;
    max-width: 560px;
    margin: 0 auto 1.5rem;
    aspect-ratio: 16/9;
    cursor: pointer;
  }
  .fc-inner {
    position: relative;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
    transition: transform .45s cubic-bezier(.4,0,.2,1);
  }
  .fc-inner.flipped { transform: rotateY(180deg); }
  .fc-face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    border-radius: var(--radius);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
    text-align: center;
    box-shadow: var(--shadow);
    user-select: none;
  }
  .fc-front {
    background: linear-gradient(135deg, #1e3a5f 0%, #1e293b 100%);
    border: 1px solid var(--accent);
  }
  .fc-back {
    background: linear-gradient(135deg, #1a3a2a 0%, #1e293b 100%);
    border: 1px solid var(--green);
    transform: rotateY(180deg);
  }
  .fc-acronym-big {
    font-size: clamp(2rem, 8vw, 3.5rem);
    font-weight: 900;
    color: var(--accent);
    letter-spacing: .04em;
    margin-bottom: .5rem;
  }
  .fc-hint { font-size: .8rem; color: var(--muted); }
  .fc-fullterm {
    font-size: clamp(1rem, 3.5vw, 1.4rem);
    font-weight: 700;
    color: var(--green);
    margin-bottom: .6rem;
  }
  .fc-def {
    font-size: clamp(.75rem, 2.5vw, .95rem);
    color: var(--muted);
    line-height: 1.5;
    max-width: 420px;
  }
  .fc-status-indicator {
    margin-top: .8rem;
    font-size: .75rem;
    color: var(--muted);
  }

  .fc-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 1rem;
    margin-bottom: 1.25rem;
  }
  .fc-nav .btn { padding: .45rem 1.25rem; }
  .fc-counter {
    min-width: 80px;
    text-align: center;
    font-size: .85rem;
    color: var(--muted);
  }

  .fc-mark-row {
    display: flex;
    gap: .5rem;
    justify-content: center;
    flex-wrap: wrap;
  }

  /* ══════════════ QUIZ VIEW ══════════════ */
  .quiz-setup {
    max-width: 480px;
    margin: 2rem auto;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.75rem;
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }
  .quiz-setup h2 { font-size: 1.2rem; }
  .quiz-setup p { font-size: .9rem; color: var(--muted); line-height: 1.5; }
  .option-group { display: flex; flex-direction: column; gap: .5rem; }
  .option-group label { font-size: .85rem; color: var(--muted); font-weight: 600; }
  .option-row { display: flex; gap: .5rem; flex-wrap: wrap; }
  .opt-btn {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--muted);
    padding: .4rem .9rem;
    font-size: .85rem;
    cursor: pointer;
    transition: all .15s;
  }
  .opt-btn.sel { background: var(--accent2); border-color: var(--accent2); color: #fff; }

  .quiz-area { max-width: 600px; margin: 0 auto; }
  .quiz-hud {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 1rem;
    font-size: .85rem;
    color: var(--muted);
    flex-wrap: wrap;
    gap: .5rem;
  }
  .quiz-score-display {
    display: flex;
    gap: 1rem;
  }
  .quiz-score-display span { font-weight: 700; }
  .correct-color { color: var(--green); }
  .wrong-color { color: var(--red); }

  .quiz-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.5rem;
    margin-bottom: 1rem;
    box-shadow: var(--shadow);
  }
  .quiz-question {
    font-size: clamp(1.4rem, 6vw, 2.2rem);
    font-weight: 900;
    color: var(--accent);
    text-align: center;
    margin-bottom: 1.25rem;
    letter-spacing: .04em;
  }
  .quiz-subtext {
    font-size: .8rem;
    color: var(--muted);
    text-align: center;
    margin-bottom: 1.25rem;
  }

  /* Multiple choice */
  .choices { display: flex; flex-direction: column; gap: .6rem; }
  .choice-btn {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    padding: .75rem 1rem;
    font-size: .9rem;
    text-align: left;
    cursor: pointer;
    transition: all .15s;
    line-height: 1.35;
  }
  .choice-btn:hover:not(:disabled) { border-color: var(--accent); background: rgba(56,189,248,.07); }
  .choice-btn.correct { background: rgba(52,211,153,.15); border-color: var(--green); color: var(--green); }
  .choice-btn.wrong { background: rgba(248,113,113,.12); border-color: var(--red); color: var(--red); }
  .choice-btn:disabled { cursor: default; }

  /* Type answer */
  .type-wrap { display: flex; flex-direction: column; gap: .75rem; }
  #type-answer {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    padding: .75rem 1rem;
    font-size: .95rem;
    outline: none;
    transition: border-color .15s;
    width: 100%;
  }
  #type-answer:focus { border-color: var(--accent); }
  .type-feedback {
    font-size: .85rem;
    padding: .6rem .9rem;
    border-radius: 8px;
    display: none;
    line-height: 1.45;
  }
  .type-feedback.show { display: block; }
  .type-feedback.correct { background: rgba(52,211,153,.12); color: var(--green); }
  .type-feedback.wrong { background: rgba(248,113,113,.1); color: var(--red); }

  .quiz-next-row { display: flex; justify-content: center; margin-top: .5rem; }

  .quiz-result {
    max-width: 480px;
    margin: 2rem auto;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 2rem;
    text-align: center;
    display: flex;
    flex-direction: column;
    gap: 1rem;
    align-items: center;
  }
  .result-emoji { font-size: 3rem; }
  .result-score { font-size: 2rem; font-weight: 900; color: var(--accent); }
  .result-sub { font-size: .9rem; color: var(--muted); }
  .result-actions { display: flex; gap: .5rem; flex-wrap: wrap; justify-content: center; }

  /* ── Scrollbar ── */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  /* ── Mobile tweaks ── */
  @media (max-width: 480px) {
    header { flex-direction: column; align-items: stretch; }
    .search-wrap { max-width: 100%; }
    .tabs { justify-content: center; }
    .fc-scene { aspect-ratio: 4/3; }
    .acronym-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header>
  <h1>Sec+ <span>SY0-701</span></h1>
  <nav class="tabs">
    <button class="tab-btn active" data-view="browse">Browse</button>
    <button class="tab-btn" data-view="flashcard">Flashcards</button>
    <button class="tab-btn" data-view="quiz">Quiz</button>
  </nav>
  <div class="search-wrap">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input id="search-input" type="search" placeholder="Search acronyms…" autocomplete="off" spellcheck="false">
  </div>
</header>

<main>

  <!-- ══ BROWSE ══ -->
  <section id="view-browse" class="view active">
    <div class="filter-bar">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="known">✅ Known</button>
      <button class="filter-btn" data-filter="learning">🔄 Learning</button>
      <button class="filter-btn" data-filter="unseen">⬜ Unseen</button>
      <span class="count-badge" id="browse-count"></span>
    </div>
    <div class="acronym-grid" id="acronym-grid"></div>
    <div class="no-results" id="no-results" style="display:none">No acronyms match your search.</div>
  </section>

  <!-- ══ FLASHCARDS ══ -->
  <section id="view-flashcard" class="view">
    <div class="fc-controls">
      <button class="btn" id="fc-shuffle-btn">🔀 Shuffle</button>
      <button class="btn" id="fc-filter-known">Hide Known</button>
      <button class="btn" id="fc-reset-btn">Reset Deck</button>
      <button class="btn" id="fc-side-btn" title="Toggle which side is shown first">🔁 Acronym first</button>
      <span class="fc-progress" id="fc-progress"></span>
    </div>
    <div class="fc-scene" id="fc-scene" role="button" aria-label="Flip card" tabindex="0">
      <div class="fc-inner" id="fc-inner">
        <div class="fc-face fc-front" id="fc-front">
          <div id="fc-front-content"></div>
        </div>
        <div class="fc-face fc-back" id="fc-back">
          <div id="fc-back-content"></div>
        </div>
      </div>
    </div>
    <div class="fc-nav">
      <button class="btn" id="fc-prev">◀ Prev</button>
      <span class="fc-counter" id="fc-counter">1 / —</span>
      <button class="btn primary" id="fc-next">Next ▶</button>
    </div>
    <div class="fc-mark-row">
      <button class="btn" id="fc-mark-known">✅ Mark Known</button>
      <button class="btn" id="fc-mark-learning">🔄 Still Learning</button>
    </div>
  </section>

  <!-- ══ QUIZ ══ -->
  <section id="view-quiz" class="view">

    <div id="quiz-setup-panel" class="quiz-setup">
      <h2>Quiz Mode</h2>
      <p>Test yourself on the SY0-701 acronyms. Choose your options and start when ready.</p>
      <div class="option-group">
        <label>Question type</label>
        <div class="option-row">
          <button class="opt-btn sel" data-opt="qtype" data-val="mc">Multiple Choice</button>
          <button class="opt-btn" data-opt="qtype" data-val="type">Type Answer</button>
        </div>
      </div>
      <div class="option-group">
        <label>Direction</label>
        <div class="option-row">
          <button class="opt-btn sel" data-opt="qdir" data-val="acronym-to-def">Acronym → Definition</button>
          <button class="opt-btn" data-opt="qdir" data-val="def-to-acronym">Definition → Acronym</button>
        </div>
      </div>
      <div class="option-group">
        <label>Question count</label>
        <div class="option-row">
          <button class="opt-btn" data-opt="qcount" data-val="10">10</button>
          <button class="opt-btn sel" data-opt="qcount" data-val="25">25</button>
          <button class="opt-btn" data-opt="qcount" data-val="50">50</button>
          <button class="opt-btn" data-opt="qcount" data-val="all">All</button>
        </div>
      </div>
      <div class="option-group">
        <label>Pool</label>
        <div class="option-row">
          <button class="opt-btn sel" data-opt="pool" data-val="all">All acronyms</button>
          <button class="opt-btn" data-opt="pool" data-val="learning">Learning only</button>
        </div>
      </div>
      <button class="btn primary" id="start-quiz-btn" style="margin-top:.5rem">Start Quiz ▶</button>
    </div>

    <div id="quiz-active-panel" class="quiz-area" style="display:none">
      <div class="quiz-hud">
        <span id="quiz-progress-label">Question 1 / 25</span>
        <div class="quiz-score-display">
          <span class="correct-color" id="quiz-correct-count">✅ 0</span>
          <span class="wrong-color" id="quiz-wrong-count">❌ 0</span>
        </div>
        <button class="btn" id="quiz-quit-btn" style="padding:.3rem .7rem;font-size:.78rem">Quit</button>
      </div>
      <div class="quiz-card">
        <div class="quiz-question" id="quiz-question">AAA</div>
        <div class="quiz-subtext" id="quiz-subtext"></div>
        <!-- MC choices injected here -->
        <div class="choices" id="mc-choices" style="display:none"></div>
        <!-- Type answer injected here -->
        <div class="type-wrap" id="type-wrap" style="display:none">
          <input id="type-answer" type="text" placeholder="Type the full term…" autocomplete="off" spellcheck="false">
          <div class="type-feedback" id="type-feedback"></div>
          <button class="btn primary" id="type-submit-btn">Submit</button>
        </div>
      </div>
      <div class="quiz-next-row" id="quiz-next-row" style="display:none">
        <button class="btn primary" id="quiz-next-btn">Next →</button>
      </div>
    </div>

    <div id="quiz-result-panel" class="quiz-result" style="display:none">
      <div class="result-emoji" id="result-emoji">🎉</div>
      <div class="result-score" id="result-score"></div>
      <div class="result-sub" id="result-sub"></div>
      <div class="result-actions">
        <button class="btn primary" id="retry-same-btn">Retry Same</button>
        <button class="btn" id="quiz-home-btn">New Quiz</button>
      </div>
    </div>

  </section>

</main>

<script>
'use strict';

/* ═══════════════════════════════════════════
   ACRONYM DATA  —  CompTIA Security+ SY0-701
   ═══════════════════════════════════════════ */
const ACRONYMS = [
  { a:"AAA", t:"Authentication, Authorization, and Accounting", d:"A security framework that controls access to resources, enforces policies, and audits usage." },
  { a:"ACL", t:"Access Control List", d:"A set of rules that define which users or systems are granted or denied access to objects." },
  { a:"AES", t:"Advanced Encryption Standard", d:"A symmetric block cipher adopted by NIST in 2001, supporting 128, 192, and 256-bit key lengths." },
  { a:"AH", t:"Authentication Header", d:"An IPSec protocol providing connectionless integrity and data origin authentication for IP packets." },
  { a:"AI", t:"Artificial Intelligence", d:"Simulation of human intelligence processes by machines, especially computer systems." },
  { a:"AIS", t:"Automated Indicator Sharing", d:"A CISA program enabling real-time exchange of cyber threat indicators between public and private sectors." },
  { a:"ALE", t:"Annualized Loss Expectancy", d:"The expected monetary loss for an asset due to a risk over a one-year period; ALE = SLE × ARO." },
  { a:"AP", t:"Access Point", d:"A networking hardware device that allows wireless devices to connect to a wired network using Wi-Fi." },
  { a:"API", t:"Application Programming Interface", d:"A set of routines, protocols, and tools for building software applications that specify how components interact." },
  { a:"APT", t:"Advanced Persistent Threat", d:"A stealthy, long-term cyberattack in which an intruder gains unauthorized access and remains undetected." },
  { a:"ARO", t:"Annualized Rate of Occurrence", d:"The estimated frequency with which a threat is expected to occur within a single year." },
  { a:"ARP", t:"Address Resolution Protocol", d:"A network protocol used to map an IP address to a physical (MAC) address on a local network." },
  { a:"ASCII", t:"American Standard Code for Information Interchange", d:"A character encoding standard that represents text in computers and communications equipment." },
  { a:"ASLR", t:"Address Space Layout Randomization", d:"A security technique that randomly arranges the address space positions of key data areas to prevent exploitation." },
  { a:"ATT&CK", t:"Adversarial Tactics, Techniques, and Common Knowledge", d:"A MITRE knowledge base of adversary tactics and techniques based on real-world observations." },
  { a:"AUP", t:"Acceptable Use Policy", d:"A policy that defines the constraints and practices a user must agree to in order to access a network or the Internet." },
  { a:"AV", t:"Antivirus / Asset Value", d:"Software designed to detect and remove malicious software; also the monetary value assigned to an asset in risk calculations." },
  { a:"B2B", t:"Business to Business", d:"Commerce transactions between businesses, such as between a manufacturer and a wholesaler." },

  { a:"UEFI", t:"Unified Extensible Firmware Interface", d:"A modern firmware interface for PCs that replaces BIOS and supports larger drives and faster boot times." },
  { a:"UPS", t:"Uninterruptible Power Supply", d:"A device that provides emergency power when the main power supply fails." },
  { a:"URI", t:"Uniform Resource Identifier", d:"A string of characters that identifies a particular resource on the Internet." },
  { a:"URL", t:"Uniform Resource Locator", d:"A reference to a web resource that specifies its location and a mechanism for retrieving it." },
  { a:"USB", t:"Universal Serial Bus", d:"An industry standard for cables, connectors, and protocols for connection and communication between computers and devices." },
  { a:"UTM", t:"Unified Threat Management", d:"A comprehensive security product that integrates multiple security functions in a single appliance." },
  { a:"UTP", t:"Unshielded Twisted Pair", d:"A popular type of copper cable used in telephone and computer networks, without electromagnetic shielding." },
  { a:"VBA", t:"Visual Basic for Applications", d:"An event-driven programming language from Microsoft, used primarily for automation in Microsoft Office." },
  { a:"VLAN", t:"Virtual Local Area Network", d:"Any broadcast domain that is partitioned and isolated in a computer network at the data link layer." },
  { a:"VM", t:"Virtual Machine", d:"An emulation of a computer system that provides the functionality of a physical computer." },
  { a:"VoIP", t:"Voice over Internet Protocol", d:"A technology that allows voice communications and multimedia sessions over Internet Protocol networks." },
  { a:"VPN", t:"Virtual Private Network", d:"A technology that creates a safe and encrypted connection over a less secure network such as the Internet." },
  { a:"WAF", t:"Web Application Firewall", d:"A firewall that monitors, filters, and blocks HTTP traffic to and from a web application." },
  { a:"WAN", t:"Wide Area Network", d:"A telecommunications network that extends over a large geographic area for communications." },
  { a:"WAP", t:"Wireless Application Protocol / Wireless Access Point", d:"(1) A technical standard for accessing information over a mobile wireless network; (2) a device that creates a wireless network." },
  { a:"WEP", t:"Wired Equivalent Privacy", d:"A deprecated security algorithm for IEEE 802.11 wireless networks, known to have serious weaknesses." },
  { a:"WIDS", t:"Wireless Intrusion Detection System", d:"An IDS that monitors the radio spectrum for unauthorized access points and abnormal activity." },
  { a:"WIPS", t:"Wireless Intrusion Prevention System", d:"An IPS that monitors radio spectrum and can take actions to prevent unauthorized wireless access." },
  { a:"WPA", t:"Wi-Fi Protected Access", d:"A security certification program developed by Wi-Fi Alliance to secure wireless computer networks." },
  { a:"WPA2", t:"Wi-Fi Protected Access 2", d:"An improvement over WPA using AES-CCMP encryption; the dominant Wi-Fi security standard." },
  { a:"WPA3", t:"Wi-Fi Protected Access 3", d:"The third generation of Wi-Fi Protected Access, adding SAE and enhanced encryption." },
  { a:"WPS", t:"Wi-Fi Protected Setup", d:"A network security standard to create a secure wireless home network, known for a PIN brute-force vulnerability." },
  { a:"XSRF", t:"Cross-Site Request Forgery", d:"An attack that tricks the victim into submitting a malicious request using the victim's authenticated session." },
  { a:"XSS", t:"Cross-Site Scripting", d:"A type of injection attack in which malicious scripts are injected into otherwise benign and trusted websites." },
  { a:"XTACACS", t:"Extended Terminal Access Controller Access Control System", d:"An extension of TACACS developed by Cisco providing more authentication and logging features." },
  { a:"ZTA", t:"Zero Trust Architecture", d:"A security model that requires strict verification of every person and device trying to access resources on a private network." },
];

/* Sort alphabetically */
ACRONYMS.sort((a,b) => a.a.localeCompare(b.a));

/* ═══════════════════════════════════════════
   STORAGE — progress per acronym
   ═══════════════════════════════════════════ */
const STORAGE_KEY = 'secplus_progress_v1';
let progress = {};
function loadProgress() {
  try { progress = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch { progress = {}; }
}
function saveProgress() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(progress));
}
function getStatus(a) { return progress[a] || 'unseen'; } // 'known' | 'learning' | 'unseen'
function setStatus(a, s) { progress[a] = s; saveProgress(); }

loadProgress();

/* ═══════════════════════════════════════════
   STATE
   ═══════════════════════════════════════════ */
let currentView = 'browse';
let searchQuery = '';
let browseFilter = 'all';

// Flashcard state
let fcDeck = [];
let fcIndex = 0;
let fcFlipped = false;
let fcHideKnown = false;
let fcFrontSide = 'acronym'; // 'acronym' | 'definition'

// Quiz state
let quizQuestions = [];
let quizIndex = 0;
let quizCorrect = 0;
let quizWrong = 0;
let quizOptions = { qtype: 'mc', qdir: 'acronym-to-def', qcount: '25', pool: 'all' };
let quizAnswered = false;
let lastQuizOptions = null;

/* ═══════════════════════════════════════════
   UTILS
   ═══════════════════════════════════════════ */
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i+1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function statusEmoji(s) {
  if (s === 'known') return '✅';
  if (s === 'learning') return '🔄';
  return '⬜';
}

/* ═══════════════════════════════════════════
   VIEW SWITCHING
   ═══════════════════════════════════════════ */
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const v = btn.dataset.view;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.view').forEach(s => s.classList.remove('active'));
    document.getElementById('view-' + v).classList.add('active');
    currentView = v;
    if (v === 'flashcard') renderFC();
    if (v === 'quiz') showQuizSetup();
  });
});

/* ═══════════════════════════════════════════
   SEARCH
   ═══════════════════════════════════════════ */
const searchInput = document.getElementById('search-input');
searchInput.addEventListener('input', () => {
  searchQuery = searchInput.value.trim().toLowerCase();
  if (currentView === 'browse') renderBrowse();
});

/* ═══════════════════════════════════════════
   BROWSE VIEW
   ═══════════════════════════════════════════ */
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    browseFilter = btn.dataset.filter;
    renderBrowse();
  });
});

function renderBrowse() {
  const grid = document.getElementById('acronym-grid');
  const noRes = document.getElementById('no-results');
  const countBadge = document.getElementById('browse-count');

  let list = ACRONYMS.filter(item => {
    if (browseFilter === 'known') return getStatus(item.a) === 'known';
    if (browseFilter === 'learning') return getStatus(item.a) === 'learning';
    if (browseFilter === 'unseen') return getStatus(item.a) === 'unseen';
    return true;
  });

  if (searchQuery) {
    list = list.filter(item =>
      item.a.toLowerCase().includes(searchQuery) ||
      item.t.toLowerCase().includes(searchQuery) ||
      item.d.toLowerCase().includes(searchQuery)
    );
  }

  countBadge.textContent = `${list.length} of ${ACRONYMS.length}`;

  if (list.length === 0) {
    grid.style.display = 'none';
    noRes.style.display = 'block';
    return;
  }
  grid.style.display = '';
  noRes.style.display = 'none';

  grid.innerHTML = list.map(item => {
    const s = getStatus(item.a);
    return `<div class="acronym-card">
      <div class="card-top">
        <span class="acronym-label">${item.a}</span>
        <div class="card-actions">
          <button class="status-btn" title="Mark Known" onclick="toggleStatus('${item.a}','known')" aria-label="Mark known">✅</button>
          <button class="status-btn" title="Mark Learning" onclick="toggleStatus('${item.a}','learning')" aria-label="Mark learning">🔄</button>
        </div>
      </div>
      <div class="full-term">${item.t}</div>
      <div class="definition">${item.d}</div>
      ${s !== 'unseen' ? `<span class="status-tag ${s}">${statusEmoji(s)} ${s.charAt(0).toUpperCase()+s.slice(1)}</span>` : ''}
    </div>`;
  }).join('');
}

function toggleStatus(acronym, newStatus) {
  const current = getStatus(acronym);
  setStatus(acronym, current === newStatus ? 'unseen' : newStatus);
  renderBrowse();
  if (currentView === 'flashcard') renderFCCard();
}

/* ═══════════════════════════════════════════
   FLASHCARD VIEW
   ═══════════════════════════════════════════ */
function buildFCDeck() {
  let pool = [...ACRONYMS];
  if (fcHideKnown) pool = pool.filter(x => getStatus(x.a) !== 'known');
  if (searchQuery) pool = pool.filter(item =>
    item.a.toLowerCase().includes(searchQuery) ||
    item.t.toLowerCase().includes(searchQuery)
  );
  fcDeck = shuffle(pool);
  fcIndex = 0;
}

function renderFC() {
  if (fcDeck.length === 0) buildFCDeck();
  renderFCCard();
}

function renderFCCard() {
  if (fcDeck.length === 0) {
    document.getElementById('fc-front-content').innerHTML = '<div class="fc-acronym-big">—</div><div class="fc-hint">No cards in deck</div>';
    document.getElementById('fc-back-content').innerHTML = '';
    document.getElementById('fc-counter').textContent = '0 / 0';
    document.getElementById('fc-progress').textContent = '';
    return;
  }
  const item = fcDeck[fcIndex];
  const s = getStatus(item.a);
  const statusHtml = s !== 'unseen' ? `<div class="fc-status-indicator">${statusEmoji(s)} ${s.charAt(0).toUpperCase()+s.slice(1)}</div>` : '<div class="fc-status-indicator"></div>';

  if (fcFrontSide === 'acronym') {
    // Front: acronym only. Back: full term + definition.
    document.getElementById('fc-front-content').innerHTML =
      `<div class="fc-acronym-big">${item.a}</div><div class="fc-hint">tap to reveal full term</div>`;
    document.getElementById('fc-back-content').innerHTML =
      `<div class="fc-fullterm">${item.t}</div><div class="fc-def">${item.d}</div>${statusHtml}`;
  } else {
    // Front: definition only. Back: acronym + full term.
    document.getElementById('fc-front-content').innerHTML =
      `<div class="fc-def" style="font-size:clamp(.8rem,2.8vw,1rem);color:var(--text)">${item.d}</div><div class="fc-hint" style="margin-top:.6rem">tap to reveal acronym</div>`;
    document.getElementById('fc-back-content').innerHTML =
      `<div class="fc-acronym-big" style="color:var(--green)">${item.a}</div><div class="fc-fullterm">${item.t}</div>${statusHtml}`;
  }

  document.getElementById('fc-counter').textContent = `${fcIndex + 1} / ${fcDeck.length}`;
  renderFCProgress();

  // Unflip on new card
  fcFlipped = false;
  document.getElementById('fc-inner').classList.remove('flipped');
}


function renderFCProgress() {
  const known = fcDeck.filter(x => getStatus(x.a) === 'known').length;
  const learning = fcDeck.filter(x => getStatus(x.a) === 'learning').length;
  document.getElementById('fc-progress').textContent = `✅ ${known}  🔄 ${learning}  ⬜ ${fcDeck.length - known - learning}`;
}

// Flip
function flipCard() {
  fcFlipped = !fcFlipped;
  document.getElementById('fc-inner').classList.toggle('flipped', fcFlipped);
}
document.getElementById('fc-scene').addEventListener('click', flipCard);
document.getElementById('fc-scene').addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); flipCard(); }
});

// Nav
document.getElementById('fc-prev').addEventListener('click', () => {
  if (fcDeck.length === 0) return;
  fcIndex = (fcIndex - 1 + fcDeck.length) % fcDeck.length;
  renderFCCard();
});
document.getElementById('fc-next').addEventListener('click', () => {
  if (fcDeck.length === 0) return;
  fcIndex = (fcIndex + 1) % fcDeck.length;
  renderFCCard();
});

// Keyboard nav
document.addEventListener('keydown', e => {
  if (currentView !== 'flashcard') return;
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'ArrowRight') document.getElementById('fc-next').click();
  if (e.key === 'ArrowLeft') document.getElementById('fc-prev').click();
  if (e.key === ' ') { e.preventDefault(); flipCard(); }
});

// Controls
document.getElementById('fc-shuffle-btn').addEventListener('click', () => {
  buildFCDeck();
  renderFCCard();
});
document.getElementById('fc-filter-known').addEventListener('click', function() {
  fcHideKnown = !fcHideKnown;
  this.textContent = fcHideKnown ? 'Show Known' : 'Hide Known';
  buildFCDeck();
  renderFCCard();
});
document.getElementById('fc-side-btn').addEventListener('click', function() {
  fcFrontSide = fcFrontSide === 'acronym' ? 'definition' : 'acronym';
  this.textContent = fcFrontSide === 'acronym' ? '🔁 Acronym first' : '🔁 Definition first';
  renderFCCard();
});
document.getElementById('fc-reset-btn').addEventListener('click', () => {
  buildFCDeck();
  renderFCCard();
});

// Mark buttons
document.getElementById('fc-mark-known').addEventListener('click', () => {
  if (!fcDeck[fcIndex]) return;
  const a = fcDeck[fcIndex].a;
  setStatus(a, getStatus(a) === 'known' ? 'unseen' : 'known');
  renderFCCard();
});
document.getElementById('fc-mark-learning').addEventListener('click', () => {
  if (!fcDeck[fcIndex]) return;
  const a = fcDeck[fcIndex].a;
  setStatus(a, getStatus(a) === 'learning' ? 'unseen' : 'learning');
  renderFCCard();
});

/* ═══════════════════════════════════════════
   QUIZ VIEW
   ═══════════════════════════════════════════ */
// Option buttons
document.querySelectorAll('.opt-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const opt = btn.dataset.opt;
    document.querySelectorAll(`.opt-btn[data-opt="${opt}"]`).forEach(b => b.classList.remove('sel'));
    btn.classList.add('sel');
    quizOptions[opt] = btn.dataset.val;
  });
});

function showQuizSetup() {
  document.getElementById('quiz-setup-panel').style.display = '';
  document.getElementById('quiz-active-panel').style.display = 'none';
  document.getElementById('quiz-result-panel').style.display = 'none';
}

document.getElementById('start-quiz-btn').addEventListener('click', startQuiz);

function startQuiz() {
  lastQuizOptions = { ...quizOptions };
  let pool = quizOptions.pool === 'learning'
    ? ACRONYMS.filter(x => getStatus(x.a) === 'learning')
    : [...ACRONYMS];

  if (pool.length < 4) {
    alert('Not enough acronyms in the selected pool (need at least 4). Mark some as "Learning" first.');
    return;
  }

  const shuffled = shuffle(pool);
  const n = quizOptions.qcount === 'all' ? shuffled.length : Math.min(parseInt(quizOptions.qcount), shuffled.length);
  quizQuestions = shuffled.slice(0, n);
  quizIndex = 0;
  quizCorrect = 0;
  quizWrong = 0;
  quizAnswered = false;

  document.getElementById('quiz-setup-panel').style.display = 'none';
  document.getElementById('quiz-result-panel').style.display = 'none';
  document.getElementById('quiz-active-panel').style.display = '';
  renderQuizQuestion();
}

function renderQuizQuestion() {
  quizAnswered = false;
  const item = quizQuestions[quizIndex];
  const dir = lastQuizOptions.qdir; // 'acronym-to-def' | 'def-to-acronym'

  document.getElementById('quiz-progress-label').textContent = `Question ${quizIndex + 1} / ${quizQuestions.length}`;
  document.getElementById('quiz-correct-count').textContent = `✅ ${quizCorrect}`;
  document.getElementById('quiz-wrong-count').textContent = `❌ ${quizWrong}`;
  document.getElementById('quiz-next-row').style.display = 'none';

  const qqEl = document.getElementById('quiz-question');
  // Reset styles each render
  qqEl.style.fontSize = '';
  qqEl.style.letterSpacing = '';
  qqEl.style.color = '';

  if (dir === 'acronym-to-def') {
    // Show the acronym — user must identify the correct definition
    qqEl.textContent = item.a;
    document.getElementById('quiz-subtext').textContent = 'Which definition matches this acronym?';
  } else {
    // Show the definition — user must identify the correct acronym
    qqEl.textContent = item.d;
    qqEl.style.fontSize = 'clamp(.85rem,2.5vw,1.05rem)';
    qqEl.style.letterSpacing = '0';
    qqEl.style.color = 'var(--text)';
    document.getElementById('quiz-subtext').textContent = 'Which acronym matches this definition?';
  }

  if (lastQuizOptions.qtype === 'mc') {
    renderMC(item, dir);
  } else {
    renderType(item, dir);
  }
}

function renderMC(item, dir) {
  document.getElementById('mc-choices').style.display = '';
  document.getElementById('type-wrap').style.display = 'none';

  const distractors = shuffle(ACRONYMS.filter(x => x.a !== item.a)).slice(0, 3);
  const choices = shuffle([item, ...distractors]);

  if (dir === 'acronym-to-def') {
    // Choices show definitions — pick the one that matches the displayed acronym
    document.getElementById('mc-choices').innerHTML = choices.map((c, i) =>
      `<button class="choice-btn" data-idx="${i}" data-correct="${c.a === item.a}"
         onclick="handleMCClick(this)">
         ${c.d}
       </button>`
    ).join('');
  } else {
    // Choices show acronyms only — full term revealed after answering
    document.getElementById('mc-choices').innerHTML = choices.map((c, i) =>
      `<button class="choice-btn" data-idx="${i}" data-correct="${c.a === item.a}"
         data-fullterm="${c.t.replace(/"/g,'&quot;')}"
         onclick="handleMCClick(this)">
         <strong>${c.a}</strong>
       </button>`
    ).join('');
  }
}

function handleMCClick(btn) {
  if (quizAnswered) return;
  quizAnswered = true;
  const isCorrect = btn.dataset.correct === 'true';
  const item = quizQuestions[quizIndex];
  const dir = lastQuizOptions.qdir;

  document.querySelectorAll('.choice-btn').forEach(b => {
    b.disabled = true;
    if (b.dataset.correct === 'true') b.classList.add('correct');
    // def-to-acronym: expand every choice to show full term after answering
    if (dir === 'def-to-acronym' && b.dataset.fullterm) {
      const acronym = b.querySelector('strong').textContent;
      b.innerHTML = `<strong>${acronym}</strong> — ${b.dataset.fullterm}`;
    }
  });
  if (!isCorrect) {
    btn.classList.add('wrong');
    quizWrong++;
  } else {
    quizCorrect++;
  }

  // acronym-to-def: replace the displayed acronym heading with the full term
  if (dir === 'acronym-to-def') {
    const qqEl = document.getElementById('quiz-question');
    qqEl.style.fontSize = 'clamp(.9rem,2.8vw,1.2rem)';
    qqEl.style.letterSpacing = '0';
    qqEl.style.color = 'var(--green)';
    qqEl.textContent = item.t;
  }

  document.getElementById('quiz-correct-count').textContent = `✅ ${quizCorrect}`;
  document.getElementById('quiz-wrong-count').textContent = `❌ ${quizWrong}`;
  document.getElementById('quiz-next-row').style.display = '';
}

function renderType(item, dir) {
  document.getElementById('mc-choices').style.display = 'none';
  document.getElementById('type-wrap').style.display = '';
  const input = document.getElementById('type-answer');
  input.value = '';
  input.disabled = false;
  input.placeholder = dir === 'acronym-to-def' ? 'Type the definition…' : 'Type the acronym…';
  input.focus();
  const fb = document.getElementById('type-feedback');
  fb.className = 'type-feedback';
  fb.textContent = '';
  document.getElementById('type-submit-btn').disabled = false;
}

function handleTypeSubmit() {
  if (quizAnswered) return;
  const item = quizQuestions[quizIndex];
  const dir = lastQuizOptions.qdir;
  const input = document.getElementById('type-answer');
  const val = input.value.trim().toLowerCase();
  if (!val) return;
  quizAnswered = true;
  input.disabled = true;
  document.getElementById('type-submit-btn').disabled = true;

  let isCorrect = false;
  let feedbackCorrect = '';
  let feedbackWrong = '';

  if (dir === 'acronym-to-def') {
    // Typed answer should match the definition
    const correctDef = item.d.toLowerCase();
    // Fuzzy: first 5 words of definition must appear in answer, or answer is very close
    const defWords = item.d.split(' ').slice(0, 5).join(' ').toLowerCase();
    isCorrect = val === correctDef
      || (val.length >= 8 && correctDef.includes(val))
      || (val.length >= 10 && val.includes(defWords.split(' ').slice(0, 3).join(' ')));
    feedbackCorrect = `✅ Correct! Definition: "${item.d}"`;
    feedbackWrong = `❌ ${item.a} = "${item.t}" — ${item.d}`;
  } else {
    // Typed answer should match the acronym
    const correctAcronym = item.a.toLowerCase();
    isCorrect = val === correctAcronym;
    feedbackCorrect = `✅ Correct! ${item.a} = ${item.t}`;
    feedbackWrong = `❌ Answer: ${item.a} (${item.t})`;
  }

  const fb = document.getElementById('type-feedback');
  fb.classList.add('show');
  if (isCorrect) {
    fb.classList.add('correct');
    fb.textContent = feedbackCorrect;
    quizCorrect++;
  } else {
    fb.classList.add('wrong');
    fb.textContent = feedbackWrong;
    quizWrong++;
  }
  // Reveal full term in the question heading after answering
  const qqEl = document.getElementById('quiz-question');
  if (dir === 'acronym-to-def') {
    qqEl.style.fontSize = 'clamp(.9rem,2.8vw,1.2rem)';
    qqEl.style.letterSpacing = '0';
    qqEl.style.color = 'var(--green)';
    qqEl.textContent = item.t;
  } else {
    qqEl.style.fontSize = 'clamp(.9rem,2.8vw,1.2rem)';
    qqEl.style.letterSpacing = '0';
    qqEl.style.color = isCorrect ? 'var(--green)' : 'var(--red)';
    qqEl.textContent = `${item.a} — ${item.t}`;
  }

  document.getElementById('quiz-correct-count').textContent = `✅ ${quizCorrect}`;
  document.getElementById('quiz-wrong-count').textContent = `❌ ${quizWrong}`;
  document.getElementById('quiz-next-row').style.display = '';
}

document.getElementById('type-submit-btn').addEventListener('click', handleTypeSubmit);
document.getElementById('type-answer')?.addEventListener('keydown', e => {
  if (e.key === 'Enter') handleTypeSubmit();
});

function advanceQuiz() {
  quizIndex++;
  if (quizIndex >= quizQuestions.length) {
    showQuizResult();
  } else {
    renderQuizQuestion();
  }
}
document.getElementById('quiz-next-btn').addEventListener('click', advanceQuiz);

function showQuizResult() {
  document.getElementById('quiz-active-panel').style.display = 'none';
  document.getElementById('quiz-result-panel').style.display = '';
  const total = quizCorrect + quizWrong;
  const pct = total > 0 ? Math.round((quizCorrect / total) * 100) : 0;
  let emoji = pct >= 90 ? '🏆' : pct >= 70 ? '🎯' : pct >= 50 ? '📚' : '💪';
  document.getElementById('result-emoji').textContent = emoji;
  document.getElementById('result-score').textContent = `${quizCorrect} / ${total} (${pct}%)`;
  document.getElementById('result-sub').textContent =
    pct >= 90 ? 'Outstanding! You really know your acronyms.' :
    pct >= 70 ? 'Great job — a bit more practice and you\'ll nail the exam.' :
    pct >= 50 ? 'Good effort! Review the ones you missed in Browse mode.' :
    'Keep studying — you\'ve got this! Use flashcards to drill the tricky ones.';
}

document.getElementById('retry-same-btn').addEventListener('click', startQuiz);
document.getElementById('quiz-home-btn').addEventListener('click', showQuizSetup);
document.getElementById('quiz-quit-btn').addEventListener('click', showQuizSetup);

/* ═══════════════════════════════════════════
   INIT
   ═══════════════════════════════════════════ */
renderBrowse();
buildFCDeck();
</script>
