# ══════════════════════════════════════════════════════════════════════════════
# Unbound DNS Resolver Configuration
# Role: Recursive upstream resolver for Pi-hole
# Listens on: 0.0.0.0:53 inside the container
#             (Docker maps this to 127.0.0.1:5335 on the host)
#
# Pi-hole is configured to upstream to 127.0.0.1#5335
# ══════════════════════════════════════════════════════════════════════════════

server:
    # ── Logging ───────────────────────────────────────────────────────────────
    # 0 = quiet (errors only). Increase to 2 or 3 for debugging.
    verbosity: 0

    # ── Network ───────────────────────────────────────────────────────────────
    # Listen on all interfaces inside the container.
    # Docker's port mapping (127.0.0.1:5335:53) handles the host-level binding.
    interface: 0.0.0.0
    port: 53

    # ── Protocols ─────────────────────────────────────────────────────────────
    do-ip4: yes
    do-udp: yes
    do-tcp: yes

    # Disable IPv6 — simplifies config for a home lab without IPv6 setup.
    # Enable if your network uses IPv6.
    do-ip6: no
    prefer-ip6: no

    # ── DNSSEC Security ───────────────────────────────────────────────────────
    # DNSSEC = cryptographic signatures on DNS responses.
    # These settings protect against DNS spoofing and cache poisoning.

    # Only trust glue records that are within the authoritative zone.
    # Prevents attackers from injecting fake glue records.
    harden-glue: yes

    # Reject responses that should have DNSSEC but don't.
    # If someone strips the DNSSEC signatures, Unbound will refuse the response.
    harden-dnssec-stripped: yes

    # Reject responses where the TTL (time-to-live) has been manipulated.
    harden-large-queries: yes

    # Reject referrals that go to an address in a private IP range
    # (prevents certain classes of DNS rebinding attacks)
    harden-referral-path: no

    # ── Query Privacy ─────────────────────────────────────────────────────────
    # Don't randomize the case of query names.
    # (Some implementations use capitalisation randomisation to detect spoofing,
    # but it breaks responses from some authoritative servers)
    use-caps-for-id: no

    # Hide Unbound's version string from responses to version queries.
    # Small operational security improvement.
    hide-version: yes
    hide-identity: yes

    # ── Performance ───────────────────────────────────────────────────────────
    # EDNS buffer size: 1232 bytes is the modern recommended value.
    # Avoids IP fragmentation issues that affect some network paths.
    edns-buffer-size: 1232

    # Fetch DNS records slightly before they expire (warm cache).
    # Speeds up queries for frequently accessed domains.
    prefetch: yes
    prefetch-key: yes

    # Number of query-handling threads. 1 is fine for a home lab.
    num-threads: 1

    # Increase OS receive buffer for better performance under load.
    so-rcvbuf: 1m

    # ── Cache ─────────────────────────────────────────────────────────────────
    # How many messages to cache (1024 per thread is adequate for home use)
    msg-cache-size: 50m
    rrset-cache-size: 100m

    # Minimum TTL: enforce that records are cached for at least 300 seconds.
    # Prevents short-TTL abuse (e.g., fast-flux DNS used by malware).
    cache-min-ttl: 300

    # Maximum TTL: don't cache records for more than 24 hours.
    cache-max-ttl: 86400

    # ── DNS Rebinding Protection ───────────────────────────────────────────────
    # These settings prevent a class of attack where an external domain name
    # resolves to an internal IP address.
    #
    # Attack scenario: attacker controls evil.com and makes DNS return 192.168.1.1.
    # Your browser then thinks evil.com is your router and attacks it via JavaScript.
    # These settings make Unbound refuse to return private IPs for public lookups.
    #
    private-address: 192.168.0.0/16    # RFC 1918 private ranges
    private-address: 169.254.0.0/16    # Link-local
    private-address: 172.16.0.0/12     # RFC 1918 private ranges
    private-address: 10.0.0.0/8        # RFC 1918 private ranges
    private-address: fd00::/8           # IPv6 unique local
    private-address: fe80::/10          # IPv6 link-local

    # ── Access Control ────────────────────────────────────────────────────────
    # Only allow queries from localhost and the Docker network.
    # Refuse everything else.
    access-control: 0.0.0.0/0 refuse
    access-control: 127.0.0.0/8 allow
    access-control: 172.20.0.0/24 allow   # Docker homelab network
    access-control: ::0/0 refuse
    access-control: ::1 allow
