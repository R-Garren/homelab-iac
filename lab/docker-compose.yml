# ══════════════════════════════════════════════════════════════════════════════
# Home Lab — CyberDefense Practice Stack
# Server:   ubuntu-server@192.168.1.10
# Location: /opt/homelab/lab/docker-compose.yml
#
# Services: OWASP Juice Shop | DVWA + MariaDB
#
# ⚠  INTENTIONALLY VULNERABLE APPLICATIONS — READ BEFORE STARTING ⚠
#
#   These containers contain known, unpatched security vulnerabilities by design.
#   They exist solely for local learning and must NEVER be exposed to the internet.
#
#   Rules of engagement:
#     1. Run on demand only  — 'docker compose up -d' to start, 'down' when done
#     2. Never port-forward  — ports are LAN-bound (192.168.1.10); don't change this
#     3. Isolated network    — lab containers cannot reach your homelab services
#     4. No restart policy   — restart: "no" means Docker never auto-starts these
#
# Usage:
#   cd /opt/homelab/lab
#   cp .env.example .env && nano .env   # Set DB passwords
#   docker compose up -d                # Start lab
#   docker compose logs -f              # Watch startup
#   docker compose down                 # Stop when done (data preserved)
#   docker compose down -v              # Stop AND wipe all data (fresh start)
# ══════════════════════════════════════════════════════════════════════════════

name: homelab-lab

# ── NETWORKS ──────────────────────────────────────────────────────────────────
# The 'lab' network is completely isolated:
#   - Not connected to the 'homelab' bridge network (your production services)
#   - Lab containers cannot reach Pi-hole, Portainer, NPM, or Unbound
#   - Lab containers cannot reach each other's networks in production
#   - 172.21.0.0/24 does not conflict with LAN (192.168.1.x) or homelab (172.20.0.x)
#
# This means even if a lab exploit gains RCE inside a container, it cannot
# pivot to your production containers or your router.
# ──────────────────────────────────────────────────────────────────────────────
networks:
  lab:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/24

# ── VOLUMES ───────────────────────────────────────────────────────────────────
# dvwa_db persists DVWA's MariaDB database between sessions.
# Use 'docker compose down -v' to wipe it and start fresh (resets security level,
# accounts, and any data you injected during exercises).
# ──────────────────────────────────────────────────────────────────────────────
volumes:
  dvwa_db:    # MariaDB data — DVWA config, user table, injected data

# ══════════════════════════════════════════════════════════════════════════════
services:

  # ─────────────────────────────────────────────────────────────────────────
  # OWASP JUICE SHOP — Modern Vulnerable Web Application
  #
  # Access: http://192.168.1.10:3000
  #
  # A deliberately insecure Node.js/Angular application maintained by OWASP.
  # Covers the full OWASP Top 10 and more across 100+ challenges.
  # Built-in scoreboard at: http://192.168.1.10:3000/#/score-board
  #
  # Why it's valuable:
  #   - Modern tech stack (SPA, REST API, JWT auth) vs DVWA's classic PHP
  #   - Challenges span injection, broken auth, XSS, IDOR, cryptographic failures
  #   - Hints system — you can get nudges without full spoilers
  #   - Industry-standard training tool used in SANS, PortSwigger, HackTheBox prep
  #
  # Start here: find the hidden score board (it's your first challenge)
  # ─────────────────────────────────────────────────────────────────────────
  juice-shop:
    image: bkimminich/juice-shop:latest
    container_name: juice-shop
    # restart: "no" — CRITICAL. Docker will never automatically start this container.
    # You must explicitly run 'docker compose up -d' each time you want to practice.
    restart: "no"
    ports:
      # LAN-only binding. 192.168.1.10 means only your LAN devices can reach this.
      # Changing to 0.0.0.0 would expose a vulnerable app to any network interface.
      - "192.168.1.10:3000:3000"
    networks:
      - lab
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # ─────────────────────────────────────────────────────────────────────────
  # DVWA DATABASE — MariaDB backend for DVWA
  #
  # Not directly accessible from outside the lab network.
  # DVWA connects to this via the service name 'dvwa-db' on the lab bridge.
  #
  # Credentials come from .env (see .env.example).
  # ─────────────────────────────────────────────────────────────────────────
  dvwa-db:
    image: mariadb:10.11
    container_name: dvwa-db
    restart: "no"
    environment:
      MYSQL_ROOT_PASSWORD: ${DVWA_DB_ROOT_PASSWORD}
      MYSQL_DATABASE: dvwa
      MYSQL_USER: dvwa
      MYSQL_PASSWORD: ${DVWA_DB_PASSWORD}
    volumes:
      - dvwa_db:/var/lib/mysql
    networks:
      - lab
    # No ports exposed — dvwa-db is reachable only within the lab network.
    # There is no way to connect to this database from your LAN or the internet.
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # ─────────────────────────────────────────────────────────────────────────
  # DVWA — Damn Vulnerable Web Application
  #
  # Access: http://192.168.1.10:8080
  # Default login: admin / password  (change in DVWA after setup)
  #
  # A classic PHP/MySQL vulnerable app — the standard starting point for
  # learning web exploitation fundamentals. Unlike Juice Shop's challenges,
  # DVWA has four difficulty levels per vulnerability type:
  #   Low      — No defenses, exploit works directly
  #   Medium   — Basic defenses (easily bypassed, teaches evasion)
  #   High     — Strong defenses with subtle weaknesses
  #   Impossible — Secure reference implementation (learn what good looks like)
  #
  # First run: visit /setup.php and click "Create / Reset Database"
  # Then set security level in DVWA Security tab before each exercise.
  #
  # Vulnerability modules:
  #   Brute Force, Command Injection, CSRF, File Inclusion, File Upload,
  #   Insecure CAPTCHA, SQL Injection, SQL Injection (Blind), Weak Session IDs,
  #   XSS (DOM), XSS (Reflected), XSS (Stored), Content Security Policy Bypass,
  #   JavaScript Attacks
  # ─────────────────────────────────────────────────────────────────────────
  dvwa:
    image: ghcr.io/digininja/dvwa:latest
    container_name: dvwa
    restart: "no"
    depends_on:
      - dvwa-db
    environment:
      DB_SERVER: dvwa-db
      DB_DATABASE: dvwa
      DB_USER: dvwa
      DB_PASSWORD: ${DVWA_DB_PASSWORD}
    ports:
      - "192.168.1.10:8080:80"
    networks:
      - lab
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
