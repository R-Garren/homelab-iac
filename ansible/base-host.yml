---
- name: Base host configuration
  hosts: all
  become: true    # run tasks with sudo (root) on the managed node

  tasks:
    - name: Update apt package cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600   # skip re-updating if cache is under 1hr old

    - name: Install baseline packages
      ansible.builtin.apt:
        name:
          - curl
          - vim
          - htop
          - net-tools
          - unattended-upgrades
        state: present

    - name: Ensure primary user is in the sudo group
      ansible.builtin.user:
        name: "{{ ansible_managed_user }}"
        groups: sudo
        append: true   # add to sudo group WITHOUT removing existing group memberships

    - name: Enable IPv4 forwarding (required for WireGuard routing)
      ansible.builtin.sysctl:
        name: net.ipv4.ip_forward
        value: "1"
        sysctl_file: /etc/sysctl.d/99-wireguard.conf
        reload: true
        state: present

    - name: Configure lid-close behavior (ignore lid close events)
      ansible.builtin.lineinfile:
        path: /etc/systemd/logind.conf
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
      loop:
        - { regexp: '^#?HandleLidSwitch=', line: 'HandleLidSwitch=ignore' }
        - { regexp: '^#?HandleLidSwitchExternalPower=', line: 'HandleLidSwitchExternalPower=ignore' }
        - { regexp: '^#?HandleLidSwitchDocked=', line: 'HandleLidSwitchDocked=ignore' }
      notify: Restart systemd-logind

    - name: Ensure unattended-upgrades periodic settings are enabled
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Unattended-Upgrade "1";
        owner: root
        group: root
        mode: '0644'

    - name: Configure unattended-upgrades automatic reboot behavior
      ansible.builtin.lineinfile:
        path: /etc/apt/apt.conf.d/50unattended-upgrades
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
      loop:
        - { regexp: '^Unattended-Upgrade::Automatic-Reboot\s', line: 'Unattended-Upgrade::Automatic-Reboot "true";' }
        - { regexp: '^Unattended-Upgrade::Automatic-Reboot-Time\s', line: 'Unattended-Upgrade::Automatic-Reboot-Time "02:00";' }

  handlers:
    - name: Restart systemd-logind
      ansible.builtin.systemd:
        name: systemd-logind
        state: restarted
